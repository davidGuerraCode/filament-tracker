<!doctype html><html><head><link rel="stylesheet" href="../../styles.css"><script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;background:var(--surface-app);padding:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.FilamentTrackerDesignSystem_5636be;
function Demo(){
  const [c,setC]=React.useState(true);
  const [r,setR]=React.useState('new');
  const [s,setS]=React.useState(false);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:14,width:280}}>
      <Input label="Brand" placeholder="Polymaker" />
      <Input label="Print temp" prefix="°C" value="220" onChange={()=>{}} />
      <Input label="Weight" error="Required" />
      <Select label="Material" value="PLA" onChange={()=>{}} options={[{value:'PLA',label:'PLA'},{value:'PETG',label:'PETG'},{value:'ABS',label:'ABS'}]} />
      <div style={{display:'flex',gap:16}}>
        <Checkbox label="Low stock" checked={c} onChange={()=>setC(!c)} />
        <Switch label="Keep-alive" checked={s} onChange={()=>setS(!s)} />
      </div>
      <div style={{display:'flex',gap:16}}>
        <Radio name="sort" label="Newest" checked={r==='new'} onChange={()=>setR('new')} />
        <Radio name="sort" label="Oldest" checked={r==='old'} onChange={()=>setR('old')} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
