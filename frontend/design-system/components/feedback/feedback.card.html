<!doctype html><html><head><link rel="stylesheet" href="../../styles.css"><script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;background:var(--surface-app);padding:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Toast, Tooltip, Dialog, Button, IconButton } = window.FilamentTrackerDesignSystem_5636be;
function Demo(){
  const [open,setOpen]=React.useState(false);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:14,width:'100%'}}>
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        <Toast tone="success" title="Queued" message="We'll notify you when ready." />
        <Toast tone="error" title="Extraction failed" />
      </div>
      <div style={{display:'flex',gap:10}}>
        <Tooltip label="Delete spool"><IconButton label="Delete">✕</IconButton></Tooltip>
        <Button onClick={()=>setOpen(true)}>Open dialog</Button>
      </div>
      <Dialog open={open} title="Delete spool?" onClose={()=>setOpen(false)} footer={<><Button variant="ghost" onClick={()=>setOpen(false)}>Cancel</Button><Button variant="danger" onClick={()=>setOpen(false)}>Delete</Button></>}>
        This removes the spool from inventory permanently.
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
