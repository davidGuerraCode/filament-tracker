<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-app);padding:16px;font-family:var(--font-mono);color:var(--text-secondary);font-size:12px;display:flex;flex-direction:column;gap:6px}
.cursor{display:inline-block;width:8px;height:14px;background:var(--caret);animation:cursor-blink 1s steps(1) infinite;vertical-align:middle}</style></head>
<body>
<div>durations: instant 80ms · fast 120ms · base 180ms · slow 280ms</div>
<div>easing: cubic-bezier(0.2,0,0,1) — snappy, no overshoot</div>
<div>terminal caret blink <span class="cursor"></span></div>
</body></html>
