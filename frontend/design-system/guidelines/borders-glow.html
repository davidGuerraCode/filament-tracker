<!-- @dsCard group="Foundations" viewport="700x130" name="Focus glow & shadows" subtitle="No drop shadows on cards — only borders + a CRT-style focus glow" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-app);padding:16px;display:flex;gap:16px;font-family:var(--font-mono);color:var(--text-tertiary);font-size:10px}
.b{width:140px;height:70px;background:var(--surface-card);border:1px solid var(--border-focus);display:flex;align-items:center;justify-content:center;color:var(--text-secondary)}</style></head>
<body>
<div><div class="b" style="box-shadow:var(--glow-focus)">focus ring</div>--glow-focus</div>
<div><div class="b" style="box-shadow:var(--glow-accent);border-color:var(--accent-primary)">accent glow</div>--glow-accent</div>
<div><div class="b" style="box-shadow:var(--shadow-panel);border-color:var(--border-subtle)">panel shadow</div>--shadow-panel (modals only)</div>
</body></html>
