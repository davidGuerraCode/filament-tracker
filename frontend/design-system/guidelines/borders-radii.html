<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-app);padding:16px;display:flex;gap:14px;font-family:var(--font-mono);color:var(--text-tertiary);font-size:10px;align-items:flex-start}
.b{width:70px;height:56px;background:var(--surface-card);border:1px solid var(--border-default);display:flex;align-items:center;justify-content:center}</style></head>
<body>
<div><div class="b" style="border-radius:var(--radius-none)"></div>none</div>
<div><div class="b" style="border-radius:var(--radius-sm)"></div>sm 2px</div>
<div><div class="b" style="border-radius:var(--radius-md)"></div>md 4px (default)</div>
<div><div class="b" style="border-radius:var(--radius-lg)"></div>lg 6px</div>
<div><div class="b" style="border-radius:var(--radius-pill);width:56px"></div>pill (switch only)</div>
</body></html>
