<!-- @dsCard group="Colors" viewport="700x150" name="Semantic surfaces & text" subtitle="Aliases used across components" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-app);padding:16px;font-family:var(--font-mono);color:var(--text-primary);font-size:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}.chip{width:16px;height:16px;border-radius:3px;border:1px solid var(--border-default)}</style></head>
<body>
<div class="row"><span class="chip" style="background:var(--surface-app)"></span>--surface-app <span class="chip" style="background:var(--surface-card)"></span>--surface-card <span class="chip" style="background:var(--surface-raised)"></span>--surface-raised <span class="chip" style="background:var(--surface-hover)"></span>--surface-hover</div>
<div class="row" style="color:var(--text-primary)">--text-primary Aa</div>
<div class="row" style="color:var(--text-secondary)">--text-secondary Aa</div>
<div class="row" style="color:var(--text-tertiary)">--text-tertiary Aa</div>
<div class="row" style="color:var(--text-link)">--text-link (hover: var(--text-link-hover))</div>
</body></html>
